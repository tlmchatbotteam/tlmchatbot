name: Deploy to GCP Compute Engine

on:
  push:
    branches:
      - GCP

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "VM_USER=Lalo" >> $GITHUB_ENV
          echo "VM_IP=34.124.143.147" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY_STR }}" > ~/.ssh/vm_ssh_key
          chmod 600 ~/.ssh/vm_ssh_key
          echo "SSH key first line:"
          head -n 1 ~/.ssh/vm_ssh_key
          echo "SSH key last line:"
          tail -n 1 ~/.ssh/vm_ssh_key
          ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts

      - name: Deploy to VM
        env:
          PROJECT_DIR: /home/Lalo/_/tlmchatbot
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          echo "Deploying to $VM_USER@$VM_IP"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm_ssh_key $VM_USER@$VM_IP << EOT
            set -e
            
            PROJECT_DIR="${PROJECT_DIR}"
            REPO_URL="${REPO_URL}"
            OPENAI_API_KEY="${OPENAI_API_KEY}"
            
            # Clone or update repository
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning repository..."
              git clone $REPO_URL -b GCP "$PROJECT_DIR"
            else
              echo "Updating repository..."
              cd "$PROJECT_DIR"
              git fetch origin
              git reset --hard origin/GCP
            fi
            
            cd "$PROJECT_DIR" || { echo "Failed to change directory to $PROJECT_DIR"; exit 1; }

            echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env
            
            # Deploy application
            if [ -f "composeup.sh" ]; then
              echo "Running custom deployment script..."
              bash composeup.sh
            else
              echo "Running standard Docker Compose deployment..."
              docker compose down || true
              docker compose up --build -d
            fi
            
            # Show recent logs
            echo "Recent application logs:"
            docker compose logs --tail=10
          EOT
