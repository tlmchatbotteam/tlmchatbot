name: Deploy to VM

on:
  push:
    branches:
      - GCP

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Thiết lập các biến môi trường cho toàn bộ job để dễ quản lý
    env:
      VM_USER: ${{ secrets.VM_USER }}
      VM_IP: ${{ secrets.VM_IP }}
      PROJECT_DIR: /home/ubuntu/test2
      REPO_URL: https://github.com/tlmchatbotteam/tlmchatbot.git

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_ssh_key
          chmod 600 ~/.ssh/vm_ssh_key
          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts

      - name: Deploy to VM
        # Truyền secret OPENAI_API_KEY vào môi trường của riêng bước này
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Connecting to $VM_USER@$VM_IP..."
          
          # Sử dụng SSH với Here Document để thực thi một loạt lệnh trên VM
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm_ssh_key $VM_USER@$VM_IP << EOT
            # Thiết lập shell để thoát ngay khi có lỗi
            set -eou pipefail

            echo "Ensuring project directory exists at $PROJECT_DIR..."
            mkdir -p "$PROJECT_DIR"
            
            # Di chuyển vào thư mục dự án
            cd "$PROJECT_DIR"

            # ✅ TẠO FILE .env: Ghi API key vào file .env trên VM
            # Docker Compose sẽ tự động đọc file này
            echo "Creating .env file..."
            echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env

            # Clone hoặc cập nhật mã nguồn
            # Kiểm tra sự tồn tại của thư mục .git để quyết định clone hay pull
            if [ ! -d ".git" ]; then
              echo "Repository not found. Cloning..."
              # Clone vào thư mục hiện tại (.)
              git clone $REPO_URL -b GCP .
            else
              echo "Repository exists. Updating..."
              git fetch origin
              git reset --hard origin/GCP
            fi

            # Deploy ứng dụng bằng composeup.sh
            echo "Running custom deployment script..."
            if [ -f "composeup.sh" ]; then
              bash composeup.sh
            else
              echo "composeup.sh not found! Running standard docker compose..."
              docker compose down || true
              docker compose up --build -d
            fi

            echo "Deployment finished. Displaying recent logs:"
            docker compose logs --tail=20
          EOT