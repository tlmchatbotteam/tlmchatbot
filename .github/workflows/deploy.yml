name: Deploy to VM

on:
  push:
    branches:
      - GCP

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "VM_USER=${{ secrets.VM_USER }}" >> $GITHUB_ENV
          echo "VM_IP=${{ secrets.VM_IP }}" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
        shell: bash

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY_STR }}" > ~/.ssh/vm_ssh_key
          chmod 600 ~/.ssh/vm_ssh_key
          ssh-keyscan -H "${{ secrets.VM_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy to VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_IP: ${{ secrets.VM_IP }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO_URL: https://github.com/tlmchatbotteam/tlmchatbot.git
          PROJECT_DIR: /home/ubuntu/test2
        run: |
          echo "Connecting to $VM_USER@$VM_IP ..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vm_ssh_key $VM_USER@$VM_IP << 'EOT'
            set -eou pipefail

            echo ">>> Checking repository..."
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning repository..."
              git clone "$REPO_URL" -b GCP "$PROJECT_DIR"
            else
              echo "Updating repository..."
              cd "$PROJECT_DIR"
              git fetch origin
              git reset --hard origin/GCP
            fi

            cd "$PROJECT_DIR" || { echo "Failed to cd to $PROJECT_DIR"; exit 1; }

            echo ">>> Exporting environment variables..."
            export OPENAI_API_KEY="${OPENAI_API_KEY}"

            if [ -f "composeup.sh" ]; then
              echo "Running custom deployment script..."
              bash composeup.sh
            else
              echo "Running standard Docker Compose deployment..."
              docker compose down || true
              docker compose up --build -d
            fi

            echo ">>> Showing recent logs:"
            docker compose logs --tail=10
          EOT
