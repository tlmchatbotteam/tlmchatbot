<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Tuyển Sinh</title>
    <style>
        :root {
            --bg-start: #f6f9fc;
            --bg-end: #e9f0ff;
            --surface: rgba(255,255,255,0.75);
            --border: rgba(0,0,0,0.06);
            --shadow: 0 6px 24px rgba(0,0,0,0.08);
            --text: #0f172a;
            --muted: #475569;
            --brand: #2563eb;
            --brand-600: #1d4ed8;
            --user-msg: #e1f5fe;
            --bot-msg: #f5f5f5;
            --chip-bg: #ffffff;
            --chip-bd: #f0f0f0;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        /* Fluid root font size: min 16px, scales with viewport, max 20px */
        html { font-size: clamp(16px, 1.1vw + 12px, 20px); }
        body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--text);
               background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
               line-height: 1.65; }

        /* App shell */
        .shell { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
        .sidebar { background: rgba(255,255,255,0.9); border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .sidebar .logo { display: flex; align-items: center; justify-content: center; }
        .sidebar .logo img { max-height: 80px; width: auto; object-fit: contain; }
        .sidebar .nav { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .sidebar .nav button { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 0.95rem; }
        .sidebar .nav button.primary { color: #fff; background: var(--brand); border-color: var(--brand); }
        .sidebar .nav button.primary:hover { background: var(--brand-600); }

        .main { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }
        .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
                  padding: 12px 16px; background: var(--surface); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
                  box-shadow: var(--shadow); }
        .brand { font-weight: 700; letter-spacing: 0.2px; font-size: 1.05rem; }
        .actions { display: flex; gap: 8px; }
        .topbar .actions button { padding: 10px 12px; border: none; border-radius: 10px; cursor: pointer; color: #fff; background: var(--brand);
                                   font-size: 0.95rem; }
        .topbar .actions button:hover { background: var(--brand-600); }

        .content { display: grid; grid-template-rows: auto 1fr; min-height: 0; }

        /* Empty state */
        #empty-state { display: grid; place-items: center; padding: 24px 16px; }
        #empty-state .greeting { text-align: center; margin: 32px 0 16px; }
        #empty-state .greeting h1 { margin: 0 0 6px; font-size: clamp(20px, 2.2vw + 12px, 32px); color: #2563eb; }
        #empty-state .greeting p { margin: 0; color: var(--muted); font-size: 1.05rem; }
        .prompts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px auto 8px; max-width: 1000px; padding: 0 8px; }
        .prompt-chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--chip-bg); border: 1px solid var(--chip-bd);
                       border-radius: 999px; cursor: pointer; font-size: 0.95rem; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .prompt-chip:hover { background: rgba(0,0,0,0.04); }

        /* Chat list */
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

        .message { max-width: min(1000px, 96%); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-size: 1.05rem; }
        .user { margin-left: auto; background: var(--user-msg); }
        .bot { margin-right: auto; background: var(--bot-msg); align-self: stretch; width: 100%; max-width: none; margin: 0; }
        .message p { margin: 0 0 8px 0; line-height: 1.6; }

        /* Balanced layout for text + single image */
        .answer { display: grid; grid-template-columns: 1.1fr 0.9fr; align-items: start; gap: 16px; }
        .answer.has-image .text { align-self: start; }
        .answer .text p { max-width: none; }
        .answer .media { }

        /* Image gallery */
        .image-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .image-container.single { grid-template-columns: 1fr; }
        .image-container figure { margin: 0; background: white; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .image-container img { width: 100%; height: auto; display: block; }
        .image-container figcaption { padding: 6px 8px; font-size: 0.9rem; color: var(--muted); }
        .bot .image-container, .bot .video { margin-left: auto; margin-right: auto; max-width: 1100px; }

        .video { position: relative; width: min(960px, 100%); aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
        .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        /* Input bar */
        #input-container { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px 16px; background: var(--surface); backdrop-filter: blur(8px);
                            border-top: 1px solid var(--border); box-shadow: var(--shadow); }
        #question { flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 999px; outline: none; background: #fff; font-size: 1rem; }
        #send-btn { padding: 12px 14px; border: none; border-radius: 999px; cursor: pointer; color: #fff; background: var(--brand); font-size: 0.95rem; }
        #send-btn:hover { background: var(--brand-600); }

        /* Full-width answers for balance */
        .bot p { max-width: 75ch; margin: 0 auto 8px; }

        /* Responsive */
        @media (max-width: 1024px) {
            .shell { grid-template-columns: 72px 1fr; }
            .sidebar { padding: 12px; }
            .sidebar .logo img { max-height: 48px; }
            .sidebar .nav .label { display: none; }
        }
        @media (max-width: 768px) {
            .answer { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar { position: sticky; top: 0; z-index: 30; flex-direction: row; align-items: center; justify-content: space-between; }
            .sidebar .nav { flex-direction: row; }
            #input-container { padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="logo"><img src="/images/lg.jpg" alt="Logo"></div>
            <div class="nav">
                <button class="primary" onclick="startNewChat()">Cuộc trò chuyện mới</button>
                <button onclick="sendHieuTruong()"><span class="label">Hiệu trưởng</span></button>
                <button onclick="sendIntroVideo()"><span class="label">Giới thiệu về trường</span></button>
                <button onclick="clearChat()"><span class="label">Xóa lịch sử</span></button>
            </div>
        </aside>

        <section class="main">
            <header class="topbar">
                <div class="brand">Chatbot Tuyển Sinh</div>
                <div class="actions">
                    <button id="intro-btn" onclick="sendIntroVideo()" title="Giới thiệu về trường">Giới thiệu</button>
                    <button id="principal-btn" onclick="sendHieuTruong()" title="Hiệu trưởng">Hiệu trưởng</button>
                </div>
            </header>

            <div class="content">
                <div id="empty-state">
                    <div class="greeting">
                        <h1>Chào bạn</h1>
                        <p>Mình có thể giúp gì cho bạn?</p>
                    </div>
                    <div class="prompts">
                        <button class="prompt-chip" onclick="sendQuick('Khái quát về trường')">Khái quát về trường</button>
                        <button class="prompt-chip" onclick="sendQuick('Hiệu trưởng nhà trường')">Hiệu trưởng nhà trường</button>
                        <button class="prompt-chip" onclick="sendQuick('video')">Giới thiệu video</button>
                        <button class="prompt-chip" onclick="sendQuick('Thư viện')">Thư viện</button>
                    </div>
                </div>

                <main id="chat-container"></main>
            </div>

            <footer id="input-container">
                <input type="text" id="question" placeholder="Nhập câu hỏi của bạn...">
                <button id="send-btn" onclick="sendQuestion()">Gửi</button>
            </footer>
        </section>
    </div>

    <script>
        function toEmbedUrl(url) {
            try {
                if (!url) return url;
                const u = new URL(url);
                if ((u.hostname.includes('youtube.com') && u.pathname === '/watch') || u.hostname === 'youtu.be') {
                    const id = u.hostname === 'youtu.be' ? u.pathname.slice(1) : u.searchParams.get('v');
                    if (id) return `https://www.youtube.com/embed/${id}`;
                }
            } catch (_) { /* ignore */ }
            return url;
        }

        function updateEmptyStateVisibility() {
            const chatContainer = document.getElementById('chat-container');
            const empty = document.getElementById('empty-state');
            if (!chatContainer || !empty) return;
            const hasMessages = chatContainer.children.length > 0;
            empty.style.display = hasMessages ? 'none' : 'grid';
        }

        function startNewChat() {
            clearChat();
        }

        function sendQuick(q) {
            const input = document.getElementById('question');
            input.value = q;
            sendQuestion();
        }

        async function sendQuestion() {
            const questionInput = document.getElementById('question');
            const question = questionInput.value.trim();
            if (!question) return;

            const chatContainer = document.getElementById('chat-container');
            const userMessage = document.createElement('div');
            userMessage.className = 'message user';
            userMessage.textContent = question;
            chatContainer.appendChild(userMessage);
            updateEmptyStateVisibility();

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();
                renderEntries(data);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                questionInput.value = '';
            } catch (error) {
                console.error('Error:', error);
                const errorMessage = document.createElement('div');
                errorMessage.className = 'message bot';
                errorMessage.textContent = 'Có lỗi xảy ra. Vui lòng thử lại!';
                chatContainer.appendChild(errorMessage);
            } finally {
                updateEmptyStateVisibility();
            }
        }

        async function sendIntroVideo() {
            const chatContainer = document.getElementById('chat-container');
            const userMessage = document.createElement('div');
            userMessage.className = 'message user';
            userMessage.textContent = 'Giới thiệu về trường';
            chatContainer.appendChild(userMessage);
            updateEmptyStateVisibility();

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: 'video' })
                });
                const data = await response.json();
                renderEntries(data);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (error) {
                console.error('Error:', error);
                const errorMessage = document.createElement('div');
                errorMessage.className = 'message bot';
                errorMessage.textContent = 'Có lỗi xảy ra. Vui lòng thử lại!';
                chatContainer.appendChild(errorMessage);
            } finally {
                updateEmptyStateVisibility();
            }
        }

        function sendHieuTruong() {
            const chatContainer = document.getElementById('chat-container');
            const userMessage = document.createElement('div');
            userMessage.className = 'message user';
            userMessage.textContent = 'Hiệu trưởng';
            chatContainer.appendChild(userMessage);

            renderHieuTruongChoices();
            chatContainer.scrollTop = chatContainer.scrollHeight;
            updateEmptyStateVisibility();
        }

        function renderHieuTruongChoices() {
            const chatContainer = document.getElementById('chat-container');
            const bot = document.createElement('div');
            bot.className = 'message bot';

            const p = document.createElement('p');
            p.textContent = 'Bạn muốn xem thông tin nào?';
            bot.appendChild(p);

            const bar = document.createElement('div');
            bar.className = 'choice-bar';

            const btnCurrent = document.createElement('button');
            btnCurrent.className = 'choice-btn';
            btnCurrent.textContent = 'Hiệu trưởng hiện tại';
            btnCurrent.onclick = () => {
                disableChoices(bar);
                askHieuTruongCurrent();
            };

            const btnHistory = document.createElement('button');
            btnHistory.className = 'choice-btn';
            btnHistory.textContent = 'Hiệu trưởng qua từng thời kỳ';
            btnHistory.onclick = () => {
                disableChoices(bar);
                askHieuTruongHistory();
            };

            bar.appendChild(btnCurrent);
            bar.appendChild(btnHistory);
            bot.appendChild(bar);
            chatContainer.appendChild(bot);
        }

        function disableChoices(container) {
            const buttons = container.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
        }

        async function askHieuTruongCurrent() {
            await askAndRender('Hiệu trưởng nhà trường');
        }

        async function askHieuTruongHistory() {
            await askAndRender('các thầy cô hiệu trưởng qua từng thời kỳ');
        }

        async function askAndRender(question) {
            const chatContainer = document.getElementById('chat-container');
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await response.json();
                renderEntries(data);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (error) {
                console.error('Error:', error);
                const errorMessage = document.createElement('div');
                errorMessage.className = 'message bot';
                errorMessage.textContent = 'Có lỗi xảy ra. Vui lòng thử lại!';
                chatContainer.appendChild(errorMessage);
            } finally {
                updateEmptyStateVisibility();
            }
        }

        function renderEntries(data) {
            const chatContainer = document.getElementById('chat-container');
            const entries = Array.isArray(data) ? data : (data ? [data] : []);

            if (entries.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'message bot';
                emptyMsg.textContent = 'Không nhận được phản hồi.';
                chatContainer.appendChild(emptyMsg);
                updateEmptyStateVisibility();
                return;
            }

            entries.forEach((item) => {
                const botMessage = document.createElement('div');
                botMessage.className = 'message bot';

                const hasText = !!item.text;
                const hasImages = Array.isArray(item.images) && item.images.length > 0;
                const hasVideo = !!item.video_url;

                if (hasText && hasImages && !hasVideo) {
                    // First image side-by-side, rest as gallery below
                    const answer = document.createElement('div');
                    answer.className = 'answer has-image';

                    const textDiv = document.createElement('div');
                    textDiv.className = 'text';
                    const p = document.createElement('p');
                    p.textContent = item.text;
                    textDiv.appendChild(p);

                    const mediaDiv = document.createElement('div');
                    mediaDiv.className = 'media';
                    const imageContainer = document.createElement('div');
                    imageContainer.className = 'image-container single';

                    const figure = document.createElement('figure');
                    const imgElement = document.createElement('img');
                    const firstImg = item.images[0];
                    imgElement.src = firstImg;
                    const firstCap = (item.captions && item.captions[0]) ? item.captions[0] : 'Hình ảnh';
                    imgElement.alt = firstCap;
                    imgElement.loading = 'lazy';
                    imgElement.style.cursor = 'zoom-in';
                    imgElement.onclick = () => window.open(firstImg, '_blank');

                    const caption = document.createElement('figcaption');
                    caption.textContent = firstCap;

                    figure.appendChild(imgElement);
                    figure.appendChild(caption);
                    imageContainer.appendChild(figure);
                    mediaDiv.appendChild(imageContainer);

                    answer.appendChild(textDiv);
                    answer.appendChild(mediaDiv);
                    botMessage.appendChild(answer);

                    if (item.images.length > 1) {
                        const gallery = document.createElement('div');
                        gallery.className = 'image-container';
                        item.images.slice(1).forEach((img, idx) => {
                            const figure2 = document.createElement('figure');
                            const img2 = document.createElement('img');
                            img2.src = img;
                            const cap2 = (item.captions && item.captions[idx + 1]) ? item.captions[idx + 1] : `Ảnh ${idx + 2}`;
                            img2.alt = cap2;
                            img2.loading = 'lazy';
                            img2.style.cursor = 'zoom-in';
                            img2.onclick = () => window.open(img, '_blank');
                            const caption2 = document.createElement('figcaption');
                            caption2.textContent = cap2;
                            figure2.appendChild(img2);
                            figure2.appendChild(caption2);
                            gallery.appendChild(figure2);
                        });
                        botMessage.appendChild(gallery);
                    }
                } else {
                    if (hasText) {
                        const p = document.createElement('p');
                        p.textContent = item.text;
                        botMessage.appendChild(p);
                    }

                    if (hasImages) {
                        const imageContainer = document.createElement('div');
                        imageContainer.className = 'image-container';
                        item.images.forEach((img, index) => {
                            const figure = document.createElement('figure');
                            const imgElement = document.createElement('img');
                            imgElement.src = img;
                            const cap = (item.captions && item.captions[index]) ? item.captions[index] : `Ảnh ${index + 1}`;
                            imgElement.alt = cap;
                            imgElement.loading = 'lazy';
                            imgElement.style.cursor = 'zoom-in';
                            imgElement.onclick = () => window.open(img, '_blank');

                            const caption = document.createElement('figcaption');
                            caption.textContent = cap;
                            figure.appendChild(imgElement);
                            figure.appendChild(caption);
                            imageContainer.appendChild(figure);
                        });
                        botMessage.appendChild(imageContainer);
                    }

                    if (hasVideo) {
                        const wrap = document.createElement('div');
                        wrap.className = 'video';
                        const iframe = document.createElement('iframe');
                        iframe.src = toEmbedUrl(item.video_url);
                        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                        iframe.allowFullscreen = true;
                        wrap.appendChild(iframe);
                        botMessage.appendChild(wrap);
                    }
                }

                chatContainer.appendChild(botMessage);
            });
            updateEmptyStateVisibility();
        }

        function clearChat() {
            const chatContainer = document.getElementById('chat-container');
            if (!chatContainer) return;
            chatContainer.innerHTML = '';
            const questionInput = document.getElementById('question');
            if (questionInput) questionInput.value = '';
            updateEmptyStateVisibility();
        }

        document.getElementById('question').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendQuestion();
        });

        // Initialize empty state visibility
        updateEmptyStateVisibility();
    </script>
</body>
</html>
